<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Late Proximal Tubule: Solute Transport</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#c9d4c8;font-family:Verdana,"DejaVu Sans",sans-serif;color:#1d2a1d}
#wrap{max-width:1200px;margin:0 auto;padding:12px 12px 28px}
#bar,#bar2,#bar3{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;align-items:center}
#bar span,#bar2 span,#bar3 span{font-size:13px;color:#4a5a48;margin-right:2px}
.sb{--c:#555;border:2px solid var(--c);background:rgba(255,255,255,.35);color:#1d2a1d;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.sb.on{background:var(--c);color:#fff}.sb.g{--c:#6b7a68}
svg{display:block;width:100%;height:auto;user-select:none}
#info{margin-top:10px;background:#bcc7b8;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;min-height:74px}
#bar .sb.dot::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}#bar .sb.dot.on::before{background:#fff}#bar:not(.pon) .sb.dot::before{display:none}
#cl{width:min(320px,60vw)}
</style></head><body>
<div id="wrap"><div id="bar"><span>Solutes:</span></div>
<svg id="fig" viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg" font-family="Verdana,'DejaVu Sans',sans-serif">
<defs id="defs">
<clipPath id="pc"><rect x="30" y="60" width="1240" height="730" rx="18"/></clipPath>
<pattern id="hp" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e0a58f"/><rect width="5" height="10" fill="#b8553a"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#111"/></marker>
</defs>
<rect width="1300" height="800" fill="#c9d4c8"/>
<text x="650" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#111">LATE PROXIMAL TUBULE</text>
<g clip-path="url(#pc)"><rect x="30" y="60" width="260" height="730" fill="#d4d4d4"/></g>
<path d="M1115,172 L1115,770 A70,24 0 0 0 1255,770 L1255,172 Z" fill="#ffcccc"/><ellipse cx="1185" cy="172" rx="70" ry="24" fill="#ffe3e3"/>
<rect x="290" y="125" width="590" height="440" rx="40" fill="#cfdae8" stroke="#7d9bc4" stroke-width="7"/>
<rect x="290" y="625" width="590" height="200" rx="40" fill="#cfdae8" stroke="#7d9bc4" stroke-width="7"/>
<rect x="405" y="558" width="46" height="70" fill="url(#hp)" stroke="#8a4a38" stroke-width="2"/>
<text x="585" y="100" font-size="20" text-anchor="middle" fill="#111">Cell of the late proximal tubule</text>
<text x="48" y="92" font-size="20" font-weight="bold" fill="#111">Lumen</text><text x="1252" y="92" font-size="20" font-weight="bold" text-anchor="end" fill="#111">Blood</text>
<g fill="#fff" stroke="#8a8a8a" stroke-width="2"><rect x="48" y="104" width="86" height="32" rx="3"/><rect x="1168" y="104" width="84" height="32" rx="3"/></g>
<g font-size="19" fill="#111" text-anchor="middle" dominant-baseline="central"><text id="mv" x="91" y="121"></text><text x="1210" y="121">0 mV</text></g>
<text x="150" y="330" font-size="34" font-weight="bold" fill="#d62d20" text-anchor="middle">↑ Cl⁻</text><text id="clt" x="150" y="372" font-size="18" text-anchor="middle" fill="#111"></text>
<text x="1185" y="330" font-size="18" text-anchor="middle" fill="#111">105 mEq/L</text>
<text x="710" y="540" font-size="20" fill="#2f8f4a" text-anchor="middle">Anion⁻</text><text x="585" y="330" font-size="20" fill="#2f8f4a" text-anchor="middle">Cl⁻ 105 mEq/L</text>
<g id="dyn"></g><g id="ptc"></g><text id="fl" x="160" y="121" font-size="15" fill="#33404c" dominant-baseline="central">Fluid flow ↓</text><g id="fx"></g></svg>
<div id="bar2" style="margin:10px 0 0"><span>Drugs and disease:</span></div>
<div id="info"></div></div>
<script>
const $=s=>document.querySelector(s);
const TK={Na:['Na⁺','#8d8a1b'],K:['K⁺','#d62d20'],Cl:['Cl⁻','#2e7d4f'],H:['H⁺','#2b4fd6'],F:['Formate⁻','#8a4fa8'],Glu:['Glucose','#2a8fa0'],Ca:['Ca²⁺, Mg²⁺','#7a5a3a']};
const SH={Na:'Na⁺',K:'K⁺',Cl:'Cl⁻',H:'H⁺',F:'Formate⁻',Glu:'Glc',Ca:'Ca²⁺/Mg²⁺'};
const INFO={Na:'<b>Na⁺</b> enters the cell by the Na⁺/H⁺ exchanger (NHE) and, in the last segment, by SGLT1 with glucose. The Na⁺–K⁺ ATPase on the blood side pumps it out and keeps intracellular Na⁺ low. Na⁺ also crosses the tight junction between cells (the dashed line), pulled by the lumen-positive potential.',
K:'<b>K⁺</b> is taken into the cell from the blood by the Na⁺–K⁺ ATPase (3 Na⁺ out, 2 K⁺ in), which uses ATP and powers the coupled transport on the lumen side.',
Cl:'<b>Cl⁻</b> rises to about 140 mEq/L in the lumen because water and HCO₃⁻ were reabsorbed earlier and Cl⁻ was left behind. It enters through the Cl⁻/formate⁻ exchanger, leaves the cell to the blood (cell Cl⁻ about 105), and also diffuses through the tight junction down its gradient. That diffusion makes the lumen slightly positive (+4 mV).',
H:'<b>H⁺</b> is secreted into the lumen by NHE in exchange for Na⁺. In the lumen it can combine with formate⁻ to form formic acid, which diffuses back into the cell and releases H⁺ and formate⁻ again, so the cycle keeps NHE and the Cl⁻ exchanger working.',
F:'<b>Formate⁻</b> is made inside the cell by one-carbon metabolism: amino acids such as serine and glycine feed formate⁻ into the cell pool (purple box). The Cl⁻/formate⁻ exchanger secretes it into the lumen. There it picks up H⁺ from NHE and becomes neutral formic acid (HCOOH), which diffuses back into the cell (dashed arrow) and splits again into H⁺ and formate⁻. This recycling links Na⁺ uptake and Cl⁻ uptake.',
Glu:'<b>Glucose</b> is taken up in the last segment by SGLT1 with Na⁺. SGLT1 has low capacity and high affinity: it mops up the small amount of glucose that the early segment (SGLT2) missed.',
Ca:'<b>Ca²⁺ and Mg²⁺</b> are reabsorbed mainly between the cells, through the tight junction (dashed arrow), not through the cell. In the late proximal tubule the lumen-positive potential and the rising luminal concentration after water reabsorption drive this passive movement.',
DX:'<b>Diamox (acetazolamide)</b> blocks carbonic anhydrase, so less H⁺ is made for NHE. Na⁺/H⁺ exchange and formate recycling fall, so less Na⁺ and Cl⁻ are taken up through the transporters.',
SGI:'<b>SGLT inhibitors</b> (gliflozins) block the Na⁺–glucose cotransporter. Here SGLT1 stops taking up glucose and its share of Na⁺, so glucose that reaches the late segment passes into the urine (glucosuria) with a little osmotic diuresis. NHE, the Cl⁻ exchanger and the tight-junction route are unaffected. Selective SGLT2 inhibitors act mainly in the early segment; blocking SGLT1 as well (for example sotagliflozin) removes this last-chance uptake too.',
FAN:'<b>Fanconi syndrome</b> is a generalized failure of proximal reabsorption. Na⁺-coupled transport falls across the board, so glucose, amino acids, phosphate and bicarbonate are lost in the urine, causing proximal (type 2) renal tubular acidosis.'};
const DEF='Select solutes to follow their routes; others fade. Turn on Moving solutes to watch Na⁺ (olive), Cl⁻ (green) and glucose (teal) drift down the lumen and cross by the transporters or between cells. Try the drugs.';
const SP=[['s0','#f4d8db','#d58f98'],['s1','#e2f2f4','#5fb0bd'],['s2','#dcd6ef','#8f84bb'],['s3','#e4f3de','#8fc486'],['s4','#f7e3c6','#d9a468']];
$('#defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id="${i}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`).join(''));
const arrow=(x1,y,x2)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#111" stroke-width="2.4" marker-end="url(#ah)"/>`;
const txt=(t,x,y,s=20)=>`<text x="${x}" y="${y}" font-size="${s}" fill="#111" dominant-baseline="central">${t}</text>`;
const el=(k,i)=>`<g class="el" data-k="${k}">${i}</g>`;
const lab=(t,c='#1d2a1d')=>t?`<text y="1" font-size="17" font-weight="bold" fill="${c}" text-anchor="middle" dominant-baseline="central" pointer-events="none">${t}</text>`:'';
const tp=(k,x,y,f,n,l,c)=>`<g class="el tp" data-k="${k}" data-x="${x}" data-y="${y}" transform="translate(${x},${y})"><title>${n}</title><circle r="34" fill="url(#${f})" stroke="#555" stroke-opacity=".5" stroke-width="2"/>${lab(l,c)}</g>`;
let h='';
h+=el('Na',arrow(225,236,355)+txt('Na⁺',366,236))+el('H',arrow(355,288,225)+txt('H⁺',366,288));
h+=el('Cl',arrow(225,424,355)+txt('Cl⁻',366,424))+el('F',arrow(355,476,225)+txt('Formate⁻',366,476));
h+=el('Na',arrow(225,699,355)+txt('Na⁺',366,699))+el('Glu',arrow(225,751,355)+txt('Glucose',366,751));
h+=el('Na',arrow(815,189,945)+txt('Na⁺',957,189))+el('K',arrow(945,241,815)+txt('K⁺',957,241));
h+=el('Cl',arrow(815,450,945)+txt('Cl⁻',957,450));
h+=el('Na Cl',`<path d="M200 600 L1090 600" stroke="#111" stroke-width="2.4" stroke-dasharray="8 6" fill="none" marker-end="url(#ah)"/><text x="48" y="600" font-size="22" font-weight="bold" fill="#111" dominant-baseline="central">Na⁺, Cl⁻</text>`);
h+=el('F H',`<line x1="225" y1="520" x2="355" y2="520" stroke="#111" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah)"/>`+txt('HCOOH → H⁺ + formate⁻',366,520,16));
h+=el('F',`<rect x="545" y="440" width="240" height="56" rx="8" fill="#efe3f5" stroke="#8a4fa8" stroke-width="2"/><text x="665" y="462" font-size="14" font-weight="bold" fill="#5a2d72" text-anchor="middle">Formate⁻ made in the cell</text><text x="665" y="482" font-size="13" fill="#5a2d72" text-anchor="middle">amino acids → one-carbon units</text><line x1="545" y1="470" x2="488" y2="470" stroke="#111" stroke-width="2.4" marker-end="url(#ah)"/>`);
h+=el('Ca',`<rect x="48" y="520" width="92" height="56" fill="#fff6d8" stroke="#a8956a" stroke-width="2"/><text x="94" y="542" font-size="17" text-anchor="middle" fill="#111">Ca²⁺</text><text x="94" y="564" font-size="17" text-anchor="middle" fill="#111">Mg²⁺</text><path d="M142 548 L428 580 L1090 580" fill="none" stroke="#5a5f9a" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#ah)"/>`);
h+=el('Glu','<rect x="570" y="685" width="170" height="64" fill="#f4f6fa" stroke="#9aa" /><text x="655" y="707" font-size="17" text-anchor="middle" fill="#111">Low capacity</text><text x="655" y="730" font-size="17" text-anchor="middle" fill="#111">High affinity</text>');
h+=tp('Na H',290,262,'s0','Na⁺/H⁺ exchanger','NHE')+tp('Cl F',290,450,'s1','Cl⁻/formate⁻ exchanger (CFEX)','CFEX')+tp('Na Glu',290,725,'s2','Na⁺–glucose cotransporter','SGLT1');
h+=tp('Na K',880,215,'s3','Na⁺–K⁺ ATPase','ATP','#2a4a9a')+tp('Cl',880,450,'s1','Cl⁻ exit (KCl cotransport)','');
const FL=[['Na',150,236,430],['H',430,288,150],['Cl',150,424,430],['F',430,476,150],['Na',150,699,430],['Glu',150,751,430],['Na',780,189,1060],['K',1060,241,780],['Cl',780,450,1060],['Na',150,600,1060,0],['Cl',150,600,1060,.25],['F',545,470,490],['Ca',150,580,1060]];
FL.forEach((f,i)=>{[0,.5].forEach(p=>{const l=SH[f[0]],w=Math.max(42,l.length*10+18);h+=`<g class="tk" data-f="${i}" data-p="${p+(f[4]||0)}" style="display:none"><rect x="${-w/2}" y="-13" width="${w}" height="26" rx="13" fill="${TK[f[0]][1]}"/><text font-size="15" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">${l}</text></g>`})});
$('#dyn').innerHTML=h;
const X=(x,y)=>`<line x1="${x-16}" y1="${y-16}" x2="${x+16}" y2="${y+16}" stroke="#c0281f" stroke-width="5"/><line x1="${x+16}" y1="${y-16}" x2="${x-16}" y2="${y+16}" stroke="#c0281f" stroke-width="5"/>`;
const NT=(t,x,y)=>`<text x="${x}" y="${y}" font-size="15" font-weight="bold" fill="#c0281f" dominant-baseline="central">${t}</text>`;
$('#fx').innerHTML=`<g class="fx" data-k="DX" style="display:none">${X(290,262)}${X(290,450)}${NT('Less H⁺ for NHE and formate recycling',40,175)}</g><g class="fx" data-k="SGI" style="display:none">${X(290,725)}${NT('SGLT blocked: glucose lost in urine',40,175)}</g><g class="fx" data-k="FAN" style="display:none">${X(290,262)}${X(290,450)}${X(290,725)}${NT('Transporter reabsorption fails',40,175)}</g>`;
const act=new Set();let last=null;const bar=$('#bar');
const FX={DX:['Diamox (acetazolamide)','#a0302a'],SGI:['SGLT inhibitor','#5a6b7d'],FAN:['Fanconi syndrome','#7a3b8c']};
const mk=(par,k,name,col)=>{const b=document.createElement('button');b.className='sb';b.dataset.k=k;b.style.setProperty('--c',col);b.textContent=name;b.onclick=()=>{if(act.has(k))act.delete(k);else{act.add(k);last=k}if(!act.has(last))last=[...act].pop()||null;upd()};par.appendChild(b)};
Object.keys(TK).forEach(k=>mk(bar,k,TK[k][0],TK[k][1]));
['Na','Cl','Glu'].forEach(k=>bar.querySelector(`[data-k="${k}"]`).classList.add('dot'));
Object.keys(FX).forEach(k=>mk($('#bar2'),k,FX[k][0],FX[k][1]));
[['All',()=>{Object.keys(TK).forEach(k=>act.add(k));last='Na'}],['Clear',()=>{act.clear();last=null}]].forEach(([n,f])=>{const b=document.createElement('button');b.className='sb g';b.textContent=n;b.onclick=()=>{f();upd()};bar.appendChild(b)});
let CL=140;
function upd(){const mv=(4*(CL-105)/35).toFixed(1).replace('.0','');$('#mv').textContent=(mv>0?'+':'')+mv+' mV';$('#clt').textContent=CL+' mEq/L';
const any=[...act].some(k=>TK[k]);document.querySelectorAll('.fx').forEach(e=>{e.style.display=act.has(e.dataset.k)?'':'none'});
document.querySelectorAll('.el').forEach(e=>{const m=e.dataset.k.split(' ').some(k=>act.has(k));e.setAttribute('opacity',any&&!m?.28:1)});
document.querySelectorAll('.sb[data-k]').forEach(b=>b.classList.toggle('on',act.has(b.dataset.k)));
$('#info').innerHTML=last?INFO[last]+(act.size>1?`<br><span style="font-size:13px;opacity:.75">Showing ${act.size} items; the text describes the one you picked last.</span>`:''):DEF}
const PC={Na:'#8d8a1b',Cl:'#2e7d4f',Glu:'#2a8fa0'},PN={Na:'Na⁺',Cl:'Cl⁻',Glu:'Glucose'},PG=$('#ptc'),PT=[];
const LY={nhe:236,pa:600,sg:699,ex:424,gl:751};
const RTE={nhe:[[290,236],[800,236],[800,189],[945,189],[1150,189]],sg:[[290,699],[850,699],[1150,699]],pa:[[290,600],[1150,600]],ex:[[290,424],[800,450],[1150,450]],gl:[[290,751],[850,751],[1150,751]]};
function prob(p){const r=p.rt;if(r==='pa')return .4+.55*(CL-105)/55;let b={nhe:.85,sg:.9,ex:.85,gl:1}[r];
if(act.has('FAN'))b=.08;if(act.has('DX')){if(r==='nhe')b*=.3;if(r==='ex')b*=.4}
if(act.has('SGI')){if(r==='sg')b=.05;if(r==='gl')b=.03}return b}
function mkP(pre){const u=Math.random(),kind=u<.45?'Na':u<.8?'Cl':'Glu',v=Math.random();
const rt=kind==='Glu'?'gl':kind==='Na'?(v<.3?'pa':v<.75?'nhe':'sg'):(v<.45?'pa':'ex'),ly=LY[rt];
const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<title>${PN[kind]}</title><circle r="10" fill="${PC[kind]}" stroke="#fff" stroke-width="2"/>`;PG.appendChild(g);
PT.push({kind,rt,ly,x:50+Math.random()*210,y:pre?140+Math.random()*Math.max(10,ly-220):140,vy:36+Math.random()*14,ph:Math.random()*6.3,st:'drift',a:pre?1:0,fade:1,g})}
let showP=false;
function stepP(t,dt){PG.style.display=showP?'':'none';$('#fl').style.display=showP?'':'none';if(!showP)return;
if(PT.length<56&&t-(stepP.s||0)>.5){stepP.s=t;mkP(0)}
const any=Object.keys(TK).some(k=>act.has(k));
for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.a=Math.min(1,p.a+dt*2);
if(p.st==='drift'){p.y+=p.vy*dt;p.x=Math.min(262,Math.max(48,p.x+Math.sin(t*1.7+p.ph)*12*dt));if(!p.passed&&p.y>=p.ly-70)p.st='appr';p.fade=Math.max(0,Math.min(1,(772-p.y)/40))}
else if(p.st==='appr'){const dx=252-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy);if(d<4){if(Math.random()<prob(p)){p.wp=RTE[p.rt].map(a=>a.slice());p.st='path'}else{p.passed=true;p.st='drift'}}else{const s=Math.min(d,95*dt);p.x+=dx/d*s;p.y+=dy/d*s}}
else if(p.st==='path'){const w=p.wp[0],dx=w[0]-p.x,dy=w[1]-p.y,d=Math.hypot(dx,dy),s=150*dt;if(d<=s){p.x=w[0];p.y=w[1];p.wp.shift();if(!p.wp.length)p.st='cap'}else{p.x+=dx/d*s;p.y+=dy/d*s}}
else{p.y+=40*dt;p.fade-=dt*.9}
if((p.st==='drift'&&p.y>775)||p.fade<=0){p.g.remove();PT.splice(i,1);continue}
const on=act.has(p.kind);p.g.setAttribute('opacity',(p.a*p.fade*(any&&!on?.28:1)).toFixed(2));
p.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${on?1.3:1})`)}}
{const b=document.createElement('button');b.className='sb g';b.textContent='Moving solutes';b.onclick=()=>{showP=!showP;b.classList.toggle('on',showP);bar.classList.toggle('pon',showP)};bar.appendChild(b)}
for(let i=0;i<22;i++)mkP(1);
const tps=[...document.querySelectorAll('.tp')],tks=[...document.querySelectorAll('.tk')];
let pt=0;function loop(ts){const t=ts/1000,dt=Math.min(.05,t-(pt||t));pt=t;stepP(t,dt);
tks.forEach(k=>{const f=FL[k.dataset.f],on=act.has(f[0]);k.style.display=on?'':'none';if(on){const u=(t/2.6+ +k.dataset.p)%1;k.setAttribute('transform',`translate(${f[1]+(f[3]-f[1])*u},${f[2]})`);k.setAttribute('opacity',Math.sin(Math.PI*u).toFixed(2))}});
tps.forEach(p=>{const on=p.dataset.k.split(' ').some(k=>act.has(k)),s=on?1+.09*Math.sin(t*4):1;p.setAttribute('transform',`translate(${p.dataset.x},${p.dataset.y}) scale(${s.toFixed(3)})`)});
requestAnimationFrame(loop)}
upd();requestAnimationFrame(loop);
</script></body></html>
